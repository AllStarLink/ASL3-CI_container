name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ast-ver:
        description: 'Asterisk LTS Version Base'
        type: string
        default: '22.10.1'
        required: true
      rpt-ver:
        description: 'app_rpt Version Tag'
        type: string
        default: '3.10.8'
        required: true
      package-ver:
        description: 'Package Revision (usually 1)'
        type: string
        default: '1'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEFAULT_AST_VER: '22.10.1'
  DEFAULT_RPT_VER: '3.10.8'
  DEFAULT_PACKAGE_VER: '1'

jobs:
  publish-asterisk-build-asl3-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
  
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Get Version
        run: |
          echo "Image Name : $IMAGE_NAME"
          echo "Username : ${{ github.actor }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 
    
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/allstarlink/asl3-ci
          tags: |
            # 1. Use the release tag as the image tag 
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            # 2. Add a dedicated tag format whenever manually triggered via workflow_dispatch
            # type=raw,value=${{ inputs.rpt-ver }}-${{ inputs.package-ver }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RPT_VER=${{inputs.rpt-ver || env.DEFAULT_RPT_VER}}
            AST_VER=${{inputs.ast-ver || env.DEFAULT_AST_VER}}
            REL_VER=${{inputs.package-ver || env.DEFAULT_PACKAGE_VER}}
