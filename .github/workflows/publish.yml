name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ast-ver:
        description: 'Asterisk LTS Version Base'
        type: string
        default: '22.10.1'
        required: true
      rpt-ver:
        description: 'app_rpt Version Tag'
        type: string
        default: '3.10.8'
        required: true
      package-ver:
        description: 'Package Revision (usually 1)'
        type: string
        default: '1'
        required: true
      arch:
        description: 'Platform Architecture'
        type: choice
        options:
        - amd64
      os:
        description: 'Debian Release Version'
        type: choice
        options:
          - trixie

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-asterisk-build-asl3-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
  
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Get Version
        run: |
          echo "Image Name : $IMAGE_NAME"
          echo "Username : ${{ github.actor }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 
    
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/allstarlink/asl3-ci

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RPT_VER=${{inputs.rpt-ver}}
            AST_VER=${{inputs.ast-ver}}
            REL_VER=${{package-ver}}
